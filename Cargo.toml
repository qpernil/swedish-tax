[package]
name = "swedish-tax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Swedish preliminary tax calculations for income year 2026"
readme = "README.md"

[lib]
name = "swedish_tax"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ron = "0.12"

[workspace]
members = ["gui", "ios-ffi", "xtask"]
default-members = [".", "gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Per Nilsson"]
license = "MIT"
repository = "https://github.com/qpernil/swedish-tax"
homepage = "https://github.com/qpernil/swedish-tax"
