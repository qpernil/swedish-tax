name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  wasm:
    name: WebAssembly C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rust-src
          targets: wasm32-unknown-emscripten
      - name: Build the shared C library for WebAssembly
        run: cargo xtask wasm --release
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
      - name: Verify the generated header is current
        run: git diff --exit-code -- ios-ffi/include/SwedishTaxFFI.h

  msrv:
    name: Minimum Rust 1.94
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.94"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Check workspace
        run: cargo check --workspace --all-targets
